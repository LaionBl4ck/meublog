<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog do Black | TDS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="home">

  <div id="site-header"></div>
  <div id="site-navbar"></div>

  <div class="container">
    
    <aside class="sidebar">
      <div class="panel-header">
        
      </div>
    </aside>

    <div class="main-content-flow">    
      <main class="content">
        <header class="content-header">
          <h1>Central de Inovação & Publicações</h1>
        </header>
        <p>Espaço dedicado a conteúdos sobre inteligência artificial, engenharia de software, desenvolvimento mobile e ecossistema de inovação tecnológica do curso de Desenvolvimento de Sistemas.</p>
      </main>

    </div>

  </div>

  <div id="site-footer"></div>

  <script src="components/layout.js"></script>
  <script>
    const form = document.getElementById('meu-form');
    const textoPost = document.getElementById('texto-post');

    if (form && textoPost) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        textoPost.innerHTML = `<p class="loading-crt">> PROCESSING_PROMPT<span class="blink">...</span></p>`;

        try {
          const response = await fetch('https://blacklaion.app.n8n.cloud/webhook/a7e624af-fc46-4a1b-b5aa-897d1eaf3c8e', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: document.getElementById('email').value,
              message: document.getElementById('message').value
            })
          });

          const text = await response.text();
          textoPost.innerHTML = marked.parse(text);
        } catch (error) {
          textoPost.innerHTML = `<p style="color: #ff3333;">> FATAL_ERROR: FAILED_TO_CONNECT_WEBHOOK.</p>`;
        }
      });
    }
  </script>
</body>

</html>
