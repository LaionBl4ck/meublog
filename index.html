<DOCTYPE html>
  <html lang="pt-br">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=7, initial-scale=1.0">
    <title>MEu SitE</title>
  </head>

  <body>
    <nav>
      <p>IA</p>
      <a href="/formspree.html">
        <p>FORMSPREE</p>
      </a>
      <p>Detalhes</p>
      <p>Sobre</p>
    </nav>
    <aside>
      <form id="meu-form">
        <div>
          <label for="email">Digite seu email</label>
          <input type="email" id="email" required>
        </div>
        <div>
          <label for="message">Mande uma message:</label>
          <textarea id="message" required></textarea>
        </div>
        </label>
        <button type="submit">Send</button>
      </form>
    </aside>
    <main>
      <header>
        <h1>BLOG DO BLACK</h1>
        <p id="texto-post">Bem vindo a o meu blog</p>
      </header>
    </main>
    <script>
      const form = document.getElementById('meu-form');
      const textoPost = document.getElementById('texto-post');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        textoPost.innerText = "🤖 A IA está pensando...";

        // Faz a requisição direto para o Webhook de PRODUÇÃO do n8n
        const response = await fetch('https://blacklaion.app.n8n.cloud/webhook/a7e624af-fc46-4a1b-b5aa-897d1eaf3c8e', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
          })
        });

        // Pede para o navegador ler a resposta como texto puro
        const text = await response.text();

        // Substitui o texto pela resposta da IA!
        textoPost.innerHTML = marked.parse(text);
      });
    </script>
  </body>

  </html>
